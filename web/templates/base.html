<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Viral Video Processor{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="{{ url_for('static', filename='images/5DLogo.gif') }}" alt="5D Media Logo" class="brand-logo">
                <span>Viral Video Processor</span>
            </div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                    <i class="fas fa-home"></i> Dashboard
                </a></li>
                <li><a href="{{ url_for('search_page') }}" class="nav-link {% if request.endpoint == 'search_page' %}active{% endif %}">
                    <i class="fas fa-search"></i> Search
                </a></li>
                <li><a href="{{ url_for('download_page') }}" class="nav-link {% if request.endpoint == 'download_page' %}active{% endif %}">
                    <i class="fas fa-download"></i> Download
                </a></li>
                <li><a href="{{ url_for('videos_page') }}" class="nav-link {% if request.endpoint == 'videos_page' %}active{% endif %}">
                    <i class="fas fa-video"></i> Videos
                </a></li>
                <li><a href="{{ url_for('analyze_page') }}" class="nav-link {% if request.endpoint == 'analyze_page' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i> Analyze
                </a></li>
                <li><a href="{{ url_for('results_page') }}" class="nav-link {% if request.endpoint == 'results_page' %}active{% endif %}">
                    <i class="fas fa-chart-bar"></i> Results
                </a></li>
                <li><a href="{{ url_for('clips_page') }}" class="nav-link {% if request.endpoint == 'clips_page' %}active{% endif %}">
                    <i class="fas fa-cut"></i> Clips
                </a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p id="loading-text">Processing...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
